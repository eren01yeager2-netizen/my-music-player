name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Android Platform, Inject Permissions & Set SDK 36
        run: |
          mkdir temp_build
          cd temp_build
          flutter create --platforms=android --project-name=my_music_player app_skeleton
          cd ..
          cp -r temp_build/app_skeleton/android .
          rm -rf temp_build

          # Set compileSdk to 36 to satisfy file_picker / lifecycle dependency
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle || true

          # Inject permissions into AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>' android/app/src/main/AndroidManifest.xml

      - name: Install Packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Music-Player-App
          path: build/app/outputs/flutter-apk/app-release.apk
