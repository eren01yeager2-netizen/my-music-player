name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Skeleton and Fix Gradle Namespace
        run: |
          mkdir temp_build
          cd temp_build
          flutter create --platforms=android --project-name=my_music_player app_skeleton
          cd ..
          cp -r temp_build/app_skeleton/android .
          rm -rf temp_build

          # Fix for older plugins missing namespace in Gradle 8
          echo "android.nonTransitiveRClass=true" >> android/gradle.properties
          echo "android.enableR8=false" >> android/gradle.properties

          # Inject subproject namespace fallback
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      android {
                          compileSdkVersion 34
                          buildToolsVersion "34.0.0"
                          if (namespace == null) {
                              namespace project.group
                          }
                      }
                  }
              }
          }
          EOF

      - name: Install Packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Music-Player-App
          path: build/app/outputs/flutter-apk/app-release.apk
          
